<title>Reloj</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reloj">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: una sola pantalla centrada, esfera analógica arriba y lectura digital debajo */
  :root {
    --bg: #eef1f5;
    --face: #ffffff;
    --ink: #1c2433;
    --muted: #6a7487;
    --tick: #b9c1cf;
    --accent: #d2512b;
    --font-display: "Space Grotesk", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12161e;
      --face: #1b212c;
      --ink: #e7ebf2;
      --muted: #8f99ab;
      --tick: #3a4352;
      --accent: #f07a52;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12161e;
    --face: #1b212c;
    --ink: #e7ebf2;
    --muted: #8f99ab;
    --tick: #3a4352;
    --accent: #f07a52;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    display: grid;
    place-items: center;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 100%;
  }
  .dial {
    width: min(340px, 80vw);
    aspect-ratio: 1;
    max-width: 100%;
  }
  .dial svg { width: 100%; height: 100%; display: block; }
  .face { fill: var(--face); stroke: var(--tick); stroke-width: 1; }
  .tick { stroke: var(--tick); stroke-width: 1.2; stroke-linecap: round; }
  .tick.hour { stroke: var(--ink); stroke-width: 2.4; }
  .num { fill: var(--muted); font-family: var(--font-mono); font-size: 9px; text-anchor: middle; dominant-baseline: central; }
  .hand { stroke: var(--ink); stroke-linecap: round; }
  .hand.h { stroke-width: 4.5; }
  .hand.m { stroke-width: 3; }
  .hand.s { stroke: var(--accent); stroke-width: 1.4; }
  .pin { fill: var(--accent); }

  .digital {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .digital .sec { color: var(--accent); }
  .date {
    font-size: 1.05rem;
    color: var(--muted);
    text-align: center;
    text-wrap: balance;
  }
  .date::first-letter { text-transform: uppercase; }
  .zone {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .readout { display: flex; flex-direction: column; align-items: center; gap: 10px; }
</style>

<main>
  <div class="dial" aria-hidden="true">
    <svg viewBox="0 0 200 200">
      <circle class="face" cx="100" cy="100" r="96"></circle>
      <g id="ticks"></g>
      <line id="hh" class="hand h" x1="100" y1="112" x2="100" y2="52"></line>
      <line id="mh" class="hand m" x1="100" y1="114" x2="100" y2="28"></line>
      <line id="sh" class="hand s" x1="100" y1="120" x2="100" y2="18"></line>
      <circle class="pin" cx="100" cy="100" r="3.5"></circle>
    </svg>
  </div>

  <div class="readout">
    <div class="digital" role="timer" aria-live="off">
      <span id="hm">00:00</span><span class="sec">:<span id="ss">00</span></span>
    </div>
    <div class="date" id="date"></div>
    <div class="zone" id="zone"></div>
  </div>
</main>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const ticks = document.getElementById("ticks");
  for (let i = 0; i < 60; i++) {
    const hour = i % 5 === 0;
    const a = (i * 6) * Math.PI / 180;
    const r1 = hour ? 80 : 85, r2 = 89;
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 100 + r1 * Math.sin(a));
    l.setAttribute("y1", 100 - r1 * Math.cos(a));
    l.setAttribute("x2", 100 + r2 * Math.sin(a));
    l.setAttribute("y2", 100 - r2 * Math.cos(a));
    l.setAttribute("class", hour ? "tick hour" : "tick");
    ticks.appendChild(l);
    if (hour) {
      const t = document.createElementNS(NS, "text");
      const n = i === 0 ? 12 : i / 5;
      t.setAttribute("x", 100 + 70 * Math.sin(a));
      t.setAttribute("y", 100 - 70 * Math.cos(a));
      t.setAttribute("class", "num");
      t.textContent = n;
      ticks.appendChild(t);
    }
  }

  const hh = document.getElementById("hh"), mh = document.getElementById("mh"), sh = document.getElementById("sh");
  const hm = document.getElementById("hm"), ss = document.getElementById("ss");
  const dateEl = document.getElementById("date");
  const dateFmt = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById("zone").textContent = tz ? tz.replace(/_/g, " ") : "Hora local";

  const pad = n => String(n).padStart(2, "0");
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function tick() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();
    const sec = smooth ? s + ms / 1000 : s;
    const min = m + sec / 60;
    const hr = (h % 12) + min / 60;
    sh.setAttribute("transform", `rotate(${sec * 6} 100 100)`);
    mh.setAttribute("transform", `rotate(${min * 6} 100 100)`);
    hh.setAttribute("transform", `rotate(${hr * 30} 100 100)`);
    hm.textContent = `${pad(h)}:${pad(m)}`;
    ss.textContent = pad(s);
    dateEl.textContent = dateFmt.format(now);
    document.title = `${pad(h)}:${pad(m)} · Reloj`;
    if (smooth) requestAnimationFrame(tick);
  }
  tick();
  if (!smooth) setInterval(tick, 1000);

  // App instalable: busca cambios al abrir y al volver a la app, y recarga sola.
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
    navigator.serviceWorker.register("sw.js").then((reg) => {
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update();
      });
      setInterval(() => reg.update(), 30 * 60 * 1000);
    }).catch(() => {});
  }
</script>
